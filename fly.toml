# Fly.io config for the Discord verification bot.
# Worker process — outbound WebSocket to Discord, no inbound HTTP.

app = "golden-pagoda-image-reader"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  OCR_ENGINE = "3"
  OCR_LANGUAGE = "eng"
  REPLY_TTL_SECONDS = "60"
  PLATFORM_ICON_DIR = "/app/icons"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1

[deploy]
  strategy = "immediate"

[processes]
  app = "python -u bot.py"
