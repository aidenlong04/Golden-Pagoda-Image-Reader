name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys to the device at once; let an in-flight deploy finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          DISCORD_TOKEN: test
          TARGET_CHANNEL_ID: "1"
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy to device
    needs: test
    # Only the maintainer's pushes to main reach the self-hosted runner — never
    # pull requests (which keeps fork PRs off your personal machine).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    steps:
      - name: Update working copy + restart service
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GP_BOT_DIR) {
            throw "GP_BOT_DIR machine env var is not set on this runner. Run scripts\install-service.ps1 (as admin), then restart the Actions runner so it picks up the variable."
          }
          if (-not (Test-Path $env:GP_BOT_DIR)) {
            throw "GP_BOT_DIR points to '$env:GP_BOT_DIR' but that folder does not exist."
          }
          Set-Location $env:GP_BOT_DIR
          $venvPy = Join-Path $env:GP_BOT_DIR '.venv\Scripts\python.exe'

          Write-Host '>> stopping GoldenPagoda service'
          Stop-Service -Name GoldenPagoda -ErrorAction SilentlyContinue

          Write-Host '>> updating working copy to origin/main'
          git config --global --add safe.directory $env:GP_BOT_DIR
          git fetch --all --prune
          git reset --hard origin/main

          if (-not (Test-Path $venvPy)) {
            Write-Host '>> creating .venv'
            python -m venv .venv
          }
          Write-Host '>> installing dependencies'
          & $venvPy -m pip install --quiet --upgrade pip
          & $venvPy -m pip install --quiet -r requirements.txt

          Write-Host '>> starting GoldenPagoda service'
          Start-Service -Name GoldenPagoda
          Write-Host '>> deploy complete'
