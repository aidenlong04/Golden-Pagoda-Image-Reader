name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys to the device at once; let an in-flight deploy finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          DISCORD_TOKEN: test
          TARGET_CHANNEL_ID: "1"
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy to device
    needs: test
    # Only the maintainer's pushes to main reach the self-hosted runner — never
    # pull requests (which keeps fork PRs off your personal machine).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    steps:
      - name: Update working copy + restart service
        shell: powershell
        run: |
          set -e
          if [ -z "$GP_BOT_DIR" ]; then
            echo "::error::GP_BOT_DIR machine env var is not set on this runner. Run scripts/install-service.ps1 (as admin), then restart the Actions runner so it picks up the variable."
            exit 1
          fi
          # wslpath converts a Windows path (C:\...) to its WSL mount point (/mnt/c/...).
          # When not in WSL (e.g. Git Bash) wslpath is absent; assume GP_BOT_DIR is
          # already a POSIX-style path in that case (Git Bash uses /c/... style paths).
          if command -v wslpath &>/dev/null; then
            WSL_BOT_DIR="$(wslpath "$GP_BOT_DIR")"
          else
            WSL_BOT_DIR="$GP_BOT_DIR"
          fi
          if [ ! -d "$WSL_BOT_DIR" ]; then
            echo "::error::GP_BOT_DIR points to '$GP_BOT_DIR' but that folder does not exist."
            exit 1
          fi
          cd "$WSL_BOT_DIR"

          echo '>> stopping GoldenPagoda service'
          powershell.exe -Command "Stop-Service -Name GoldenPagoda -ErrorAction SilentlyContinue"

          echo '>> updating working copy to origin/main'
          git fetch --all --prune
          git reset --hard origin/main

          # Use python.exe (Windows Python) so the venv uses Windows paths (.venv\Scripts\python.exe)
          VENV_PY="$WSL_BOT_DIR/.venv/Scripts/python.exe"
          if [ ! -f "$VENV_PY" ]; then
            echo '>> creating .venv'
            python.exe -m venv .venv
          fi
          echo '>> installing dependencies'
          "$VENV_PY" -m pip install --quiet --upgrade pip
          "$VENV_PY" -m pip install --quiet -r requirements.txt

          echo '>> starting GoldenPagoda service'
          powershell.exe -Command "Start-Service -Name GoldenPagoda"
          echo '>> deploy complete'
