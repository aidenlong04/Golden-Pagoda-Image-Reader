name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # HETZNER_SSH_KEY is base64-encoded private key (avoids any
          # whitespace/CRLF mangling by the GitHub secrets UI).
          echo "${{ secrets.HETZNER_SSH_KEY }}" | base64 -d > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keygen -y -f ~/.ssh/hetzner > /dev/null  # validate
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hetzner" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.venv' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'icons' \
            ./ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/golden-pagoda/"

      - name: Build image and restart service
        run: |
          ssh -i ~/.ssh/hetzner "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -e
            cd /opt/golden-pagoda
            sudo mkdir -p /opt/golden-pagoda/data /opt/golden-pagoda/icons
            # Container runs as uid 10001 (bot); the bind-mounted data dir
            # must be writable by that uid, otherwise sqlite3.connect fails.
            sudo chown -R 10001:10001 /opt/golden-pagoda/data
            # Daemon-wide log rotation defaults so any transient container is bounded.
            if [ ! -f /etc/docker/daemon.json ]; then
                echo "{\"log-driver\":\"json-file\",\"log-opts\":{\"max-size\":\"10m\",\"max-file\":\"3\"}}" \
                    | sudo tee /etc/docker/daemon.json > /dev/null
                sudo systemctl reload docker || sudo systemctl restart docker
            fi
            sudo install -m 0644 scripts/golden-pagoda.service /etc/systemd/system/golden-pagoda.service
            sudo chmod +x scripts/golden-pagoda-watchdog.sh
            sudo install -m 0644 scripts/golden-pagoda-watchdog.service /etc/systemd/system/golden-pagoda-watchdog.service
            # Old timer-based watchdog is superseded by the long-running service.
            sudo systemctl disable --now golden-pagoda-watchdog.timer 2>/dev/null || true
            sudo rm -f /etc/systemd/system/golden-pagoda-watchdog.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now golden-pagoda-watchdog.service
            sudo systemctl restart golden-pagoda-watchdog.service
            DOCKER_BUILDKIT=1 docker build -t golden-pagoda:latest . | tail -3
            sudo systemctl restart golden-pagoda
            sleep 5
            systemctl is-active golden-pagoda
            docker logs golden-pagoda --tail 20
            # Reclaim build cache & dangling images (keeps disk healthy on CX22).
            # Build cache adds up fast on subsequent deploys — drop everything
            # not used by the running image. Layers from the just-built image
            # are pinned (in use) so this is safe.
            docker image prune -af >/dev/null || true
            docker builder prune -af >/dev/null || true
          '
