name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # HETZNER_SSH_KEY is base64-encoded private key (avoids any
          # whitespace/CRLF mangling by the GitHub secrets UI).
          echo "${{ secrets.HETZNER_SSH_KEY }}" | base64 -d > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keygen -y -f ~/.ssh/hetzner > /dev/null  # validate
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hetzner" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.venv' \
            --exclude '.env' \
            ./ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/opt/golden-pagoda/"

      - name: Build image and restart service
        run: |
          ssh -i ~/.ssh/hetzner "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -e
            cd /opt/golden-pagoda
            sudo install -m 0644 scripts/golden-pagoda.service /etc/systemd/system/golden-pagoda.service
            sudo install -m 0755 scripts/golden-pagoda-watchdog.sh /opt/golden-pagoda/scripts/golden-pagoda-watchdog.sh
            sudo install -m 0644 scripts/golden-pagoda-watchdog.service /etc/systemd/system/golden-pagoda-watchdog.service
            sudo install -m 0644 scripts/golden-pagoda-watchdog.timer /etc/systemd/system/golden-pagoda-watchdog.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now golden-pagoda-watchdog.timer
            docker build -t golden-pagoda:latest . | tail -3
            sudo systemctl restart golden-pagoda
            sleep 5
            systemctl is-active golden-pagoda
            docker logs golden-pagoda --tail 20
          '
